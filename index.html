<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이해브 견적서 시스템</title>
    <style>
        /* 제목·설명용 Paperlogy 웹폰트 (사운드컴퍼스 견적서와 같은 CDN) */
        @font-face {
            font-family: 'Paperologi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperologi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            /* 사운드컴퍼스 로고 그라데이션: 브랜드 파랑 → 청록 */
            background: linear-gradient(135deg, #499cdf 0%, #4fd1c5 100%) fixed;
            color: #202020;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .hub {
            width: 100%;
            max-width: 720px;
        }
        .hub-header {
            margin-bottom: 56px;
            text-align: center;
            color: #ffffff;
        }
        .hub-title {
            margin: 0 0 18px;
            font-family: 'Paperologi', 'Noto Sans KR', sans-serif;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.15;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }
        /* 제목 2줄: 회사명(작게) / 견적서 시스템(크게) — * 규칙보다 우선하도록 span 에도 폰트 지정 */
        .hub-title span {
            display: block;
            font-family: 'Paperologi', 'Noto Sans KR', sans-serif;
        }
        .hub-title-company {
            margin-bottom: 6px;
            font-size: 24px;
            opacity: 0.92;
        }
        .hub-title-main {
            font-size: 56px;
            letter-spacing: -1px;
        }
        .hub-desc {
            margin: 0;
            font-family: 'Paperologi', 'Noto Sans KR', sans-serif;
            font-size: 17px;
            font-weight: 400;
            opacity: 0.92;
        }
        .hub-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }
        .hub-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 36px 20px;
            border-radius: 14px;
            background-color: #ffffff;
            color: #202020;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(15, 60, 100, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .hub-card:hover,
        .hub-card:focus-visible {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(15, 60, 100, 0.22);
            outline: none;
        }
        .hub-card img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }
        .hub-card-text { text-align: center; }
        .hub-card-name {
            font-size: 18px;
            font-weight: 700;
        }
        .hub-card-sub {
            font-size: 13px;
            color: #64748b;
        }
        @media screen and (max-width: 640px) {
            body { padding: 96px 16px 48px; align-items: flex-start; }
            .hub-header { margin-bottom: 56px; }
            .hub-title { margin-bottom: 14px; word-break: keep-all; }
            .hub-title-company { font-size: 18px; }
            .hub-title-main { font-size: 40px; }
            .hub-desc { font-size: 15px; word-break: keep-all; }
            .hub-grid { grid-template-columns: 1fr; gap: 12px; }
            .hub-card { flex-direction: row; justify-content: flex-start; padding: 18px; gap: 16px; }
            .hub-card img { width: 52px; height: 52px; }
            .hub-card-text { display: flex; flex-direction: column; gap: 2px; text-align: left; }
        }
    </style>
</head>
<body>
    <main class="hub">
        <header class="hub-header">
            <h1 class="hub-title">
                <span class="hub-title-company">(주)아이해브</span>
                <span class="hub-title-main">견적서 시스템</span>
            </h1>
            <p class="hub-desc">견적서를 작성할 서비스를 선택해 주세요.</p>
        </header>
        <div class="hub-grid">
            <a class="hub-card" href="soundcompass/index.html">
                <img src="soundcompass/logo-soundlocalization.png" alt="">
                <div class="hub-card-text">
                    <div class="hub-card-name">사운드컴퍼스</div>
                    <div class="hub-card-sub">소리방향성시스템 견적서</div>
                </div>
            </a>
            <a class="hub-card" href="speechear/index.html">
                <img src="speechear/logo_256.png" alt="">
                <div class="hub-card-text">
                    <div class="hub-card-name">말귀</div>
                    <div class="hub-card-sub">말귀 견적서</div>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
